project:
  name: visionpilot
  seed: 42
  experiment_root: experiments
model:
  backend: numpy_smoke
  id: openvla/openvla-7b
  action_dim: 7
  image_size: 64
  dtype: float32
dataset:
  name: synthetic_smoke
  version: local-v1
  train_path: null
  validation_path: null
  cache_dir: data/processed
training:
  smoke_test: true
  allow_large_run: false
  epochs: 1
  micro_batch_size: 2
  gradient_accumulation: 4
  learning_rate: 0.01
  lora_rank: 4
  lora_alpha: 8
  checkpoint_every_steps: 5
  max_samples: 64
  resume_from: null
evaluation:
  split: validation
  action_space: continuous
  latency_warmup: 3
  latency_iterations: 20
safety:
  hardware_enabled: false
  dry_run: true
  min_confidence: 0.65
  max_actions_per_second: 2.0
