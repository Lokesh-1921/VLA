[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpilot"
version = "0.1.0"
description = "Reproducible Vision-Language-Action domain-adaptation research scaffold"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{name = "VisionPilot contributors"}]
dependencies = ["numpy>=1.26", "Pillow>=10.0", "PyYAML>=6.0", "psutil>=5.9"]

[project.optional-dependencies]
webcam = ["opencv-python>=4.9"]
openvla = ["torch>=2.3", "transformers>=4.40", "accelerate>=0.30", "peft>=0.11", "safetensors>=0.4"]
mlx = ["mlx>=0.18; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
